<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrapper">
    <div class="top-bar">
      <h1 class="game-title">TETRIS</h1>
      <label class="theme-toggle">
        <input type="checkbox" id="theme-switch" aria-label="Cambiar a modo claro" />
        <span class="theme-slider"></span>
        <span class="theme-label">MODO CLARO</span>
      </label>
    </div>
    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd> pausa</li>
          </ul>
        </div>
      </aside>
    </div>

    <div id="overlay" class="overlay hidden">
      <div class="overlay-box">
        <p id="overlay-title">GAME OVER</p>
        <p id="overlay-score"></p>
        <form id="name-form" class="name-form hidden" autocomplete="off">
          <p id="record-msg">¡Nuevo récord! Ingresa tu nombre</p>
          <div class="name-row">
            <input type="text" id="name-input" maxlength="12" placeholder="Tu nombre" aria-label="Nombre del jugador" />
            <button type="submit" id="save-btn">Guardar</button>
          </div>
        </form>
        <div id="records" class="records hidden">
          <span class="label">TOP 5</span>
          <ol id="records-list"></ol>
          <p id="records-stats" class="records-stats"></p>
          <button type="button" id="reset-records-btn">Resetear records</button>
        </div>
        <button id="restart-btn">Jugar</button>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
